name: Governance Gates (Repo + Docs) - OSS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick Gates (Layering + Meta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (root)
        run: npm install --legacy-peer-deps || npm install

      - name: Gate 4 - Layering Consistency
        run: node scripts/gates/layering-consistency-gate.mjs

      - name: Gate v2 - Docs Legacy Meta Blocks
        run: node scripts/gates/docs-legacy-meta-gate.mjs

      - name: Gate v3 - Docs Frontmatter Completeness
        run: node scripts/gates/docs-frontmatter-gate.mjs

  docs:
    name: Docs Gates (Build + Header/Entry)
    runs-on: ubuntu-latest
    needs: [quick]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Docs dependencies
        run: cd docs && npm ci

      - name: Build Docs
        run: cd docs && npm run build

      - name: Gate 1A - Repo/Docs Entry Closure
        run: node scripts/gates/entry-closure-gate-repo-docs.mjs

      - name: Gate 3 - Docs Identity Header
        run: node scripts/gates/docs-header-gate.mjs

# Note: Website Gates (Gate 1B, Gate 2) not applicable in OSS package
# Website is maintained in separate repository

name: Governance Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-gates:
    name: Quick Gates (Layering + Meta)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gate 4 - Layering Consistency
        run: node scripts/gates/layering-consistency-gate.mjs

      - name: Gate v2 - Docs Legacy Meta Blocks
        run: node scripts/gates/docs-legacy-meta-gate.mjs

      - name: Gate v3 - Docs Frontmatter Completeness
        run: node scripts/gates/docs-frontmatter-gate.mjs

  docs-gates:
    name: Docs Gates (Build + Entry/Header)
    runs-on: ubuntu-latest
    needs: [quick-gates]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install Docs dependencies
        run: cd docs && npm ci

      - name: Build Docs
        run: cd docs && npm run build

      - name: Gate 1 - Entry Anchors & Closure
        run: node scripts/gates/entry-closure-gate.mjs

      - name: Gate 3 - Docs Identity Header
        run: node scripts/gates/docs-header-gate.mjs

  website-gates:
    name: Website Gates (Build + Entity Disambiguation)
    runs-on: ubuntu-latest
    needs: [quick-gates]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MPLP_website/package-lock.json

      - name: Install Website dependencies
        run: cd MPLP_website && npm ci

      - name: Build Website
        run: cd MPLP_website && npm run build

      - name: Gate 2 - Entity Disambiguation
        run: node scripts/gates/entity-disambiguation-gate.mjs

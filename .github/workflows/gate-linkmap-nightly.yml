name: Gate — LinkMap Nightly (External Links)

on:
  schedule:
    # Run at 02:00 UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger

jobs:
  gate-linkmap-external:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Install lychee for external link checking
      - name: Install lychee
        run: |
          curl -sSL https://github.com/lycheeverse/lychee/releases/download/v0.17.0/lychee-v0.17.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv lychee /usr/local/bin/

      # Build docs first (required for accurate link extraction)
      - name: Build Docs
        run: pnpm -C docs build

      # Run LINK-02 external link check
      - name: Gate-LINK-02 (External Link Check)
        id: link-check
        run: |
          # Build exclude flags from allowlist (target_url fields)
          EXCLUDES=""
          if [ -f governance/allowlists/ALLOW-LINKMAP-01.yaml ]; then
            while IFS= read -r url; do
              [ -n "$url" ] && EXCLUDES="$EXCLUDES --exclude $url"
            done < <(grep -E '^\s*-?\s*target_url:\s*' governance/allowlists/ALLOW-LINKMAP-01.yaml | sed -E 's/^\s*-?\s*target_url:\s*"?([^"]+)"?/\1/')
          fi

          lychee \
            --verbose \
            --no-progress \
            --accept 200,201,204,301,302,307,308 \
            --timeout 30 \
            --max-retries 3 \
            --retry-wait-time 5 \
            --exclude 'localhost' \
            --exclude '127.0.0.1' \
            --exclude 'example.com' \
            $EXCLUDES \
            --format markdown \
            --output lychee-report.md \
            'docs/docs/**/*.md' 'docs/docs/**/*.mdx'

      # Upload report as artifact
      - name: Upload Link Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report-${{ github.run_id }}
          path: lychee-report.md
          retention-days: 30

      # Create audit file (for manual review)
      - name: Generate Audit Report
        if: always()
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p governance/audits
          cat > governance/audits/AUDIT-LINKMAP-${DATE}-LINK02-AUTO.md <<EOF
          # AUDIT-LINKMAP-${DATE}-LINK02 (Nightly)

          **Generated by:** GitHub Actions (gate-linkmap-nightly.yml)
          **Date:** ${DATE}
          **Scope:** External links in docs/docs/**

          ## Gate-LINK-02 Results

          See attached lychee-report.md artifact for full details.

          ## Summary

          - External link check completed
          - Review lychee-report.md for failed/timeout links
          - Add permanent exceptions to ALLOW-LINKMAP-01.yaml
          EOF

      # Post summary to workflow
      - name: Summary
        if: always()
        run: |
          echo "## 🔗 Link Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lychee-report.md ]; then
            head -100 lychee-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi

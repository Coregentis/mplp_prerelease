name: Gate — LinkMap (Docs)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/**"
      - "governance/rules/**"
      - "governance/tools/linkmap/**"

jobs:
  gate-linkmap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # PR Required: stable gates only (LINK-01 + LINK-03)
      # Does not emit audit files to avoid PR noise
      # Does not check external links (LINK-02) to avoid network flakiness
      - name: Gate-LINK-01 + Gate-LINK-03
        run: pnpm gate:linkmap

# MPLP v1.0 Release Packaging Config

# Protocol Version (Frozen)
version: "1.0.0"

include:
  - "README.md"
  - "CHANGELOG.md"
  - "LICENSE.txt"
  - "CODE_OF_CONDUCT.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "GOVERNANCE.md"
  - "MAINTAINERS.md"
  - "RELEASE_NOTES.md"
  - "VERSION.txt"
  - "schemas/v2/**"
  - "docs/**"  # Docs source only (build artifacts excluded below)
  - "assets/**"
  - "tests/**"  # All test suites: golden, cross-language, runtime-compat, schema-alignment
  - "packages/**"  # Reference SDK sources
  - "examples/**"
  - ".github/ISSUE_TEMPLATE/**"
  - ".github/PULL_REQUEST_TEMPLATE.md"
  - ".github/workflows/deploy-docs.yml"
  - ".github/workflows/semantic-lint.yml"
  - ".github/workflows/link-health.yml"
  - ".github/workflows/ci-release.yml"
  - ".github/workflows/gates.yml"
  - ".github/workflows/codeql.yml"
  - ".eslintrc.json"
  - "scripts/semantic/**"
  - "scripts/gates/**"  # Governance gates for CI
  # Public Governance Specifications
  - "governance/DGP-*.md"
  - "governance/DGP-*.yaml"
  - "governance/README.md"
  - "governance/public-surface/PSG-CROSSLINK-SSOT.yaml"
  - "governance/RELEASE_ATTESTATION_*.md"

exclude:
  # External repositories / submodules
  - "MPLP_website/**"
  
  # Build artifacts and caches (match directory names directly)
  - "**/node_modules"
  - "**/node_modules/**"
  - "**/dist"
  - "**/dist/**"
  - "**/build"
  - "**/build/**"
  - "docs/.docusaurus"
  - "docs/.docusaurus/**"
  - "docs/.cache"
  - "docs/.cache/**"
  - "docs/static/mermaid"
  - "docs/static/mermaid/**"  # Build-time generated SVGs (reproducible from source)
  
  # Version control
  - ".git/**"
  - ".github/workflows/codeql-db/**"
  
  # Development tools
  - "tools/**"
  - "reports/**"
  - "scripts/release/**"
  
  # Internal governance (operational artifacts, not normative)
  - "governance/archive/**"
  - "governance/internal-ops/**"
  - "governance/*_AUDIT_REPORT.*"
  - "governance/*_WAIVERS.yaml"
  - "governance/*_FREEZE_RECORD_*.md"
  - "governance/freeze/**"  # Internal freeze records
  
  # Deprecated / backup directories
  - "docs-upgrade-kit/**"
  - "docs-backup-corrupted/**"
  - ".archive/**"
  - "internal/**"
